<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1A2E">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Live website build progress for World Mission Initiative.">
  <title>WMI Website Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>html.reveal-pending body > .wrap { visibility: hidden; }</style>
  <script>
    // ?reveal=1 previews Zach's page early; hide the progress view until the swap runs.
    if (/[?&]reveal=1(&|$)/.test(location.search)) document.documentElement.classList.add("reveal-pending");
  </script>
  <style id="progressCss">
    :root {
      --navy: #0B1A2E;
      --card: #122640;
      --blue: #3D6BFF;
      --cyan: #22D3EE;
      --green: #22C55E;
      --amber: #FBBF24;
      --ink: #F3F5F8;
      --muted: #9FB0C8;
      --track: #0A1424;
      --line: #1E3352;
      --queued: #3A4A63;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--navy);
      color: var(--ink);
      min-height: 100%;
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      padding: 28px 20px;
      padding-top: max(28px, env(safe-area-inset-top));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .kicker {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin: 6px 0 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .live-line {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--green);
      flex: 0 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 22px;
      margin-top: 22px;
    }

    .card + .card, .grid { margin-top: 16px; }

    .overall-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .overall-label {
      font-size: 14px;
      color: var(--muted);
    }

    .pct {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 34px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .bar-wrap {
      margin-top: 12px;
      filter: drop-shadow(0 0 var(--glow, 14px) rgba(34, 211, 238, 0.55));
    }

    .bar-track {
      height: 16px;
      background: var(--track);
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    .preview {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .preview strong {
      color: var(--amber);
      font-weight: 700;
    }

    .section-label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .section-label.green { color: var(--green); margin-bottom: 8px; }
    .section-label.amber { color: var(--amber); margin-bottom: 8px; }

    .page-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-row:last-child { border-bottom: none; }

    .page-name {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 7px;
      border: 2px solid currentColor;
      background: currentColor;
      flex: 0 0 auto;
    }

    .dot.queued {
      background: transparent;
    }

    .page-status {
      font-size: 13px;
      font-weight: 600;
    }

    .grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .grid .card {
      flex: 1 1 280px;
      margin-top: 0;
    }

    .item {
      font-size: 14px;
      padding: 4px 0;
      line-height: 1.45;
    }
  </style>
  <style id="zachCss" media="not all">
:root{
  --ink:#0B0E14; --blue:#1F3FD6; --navy:#173653; --light:#E6EBFC; --wash:#F3F5F8;
  --body:#3A4150; --hint:#5B6372; --rule:#E3E6EC; --rule2:#C9CFD9; --onnavy:#B9C3DD; --ebnavy:#B9CBE0;
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff;font-size:17px;line-height:1.55}
img{max-width:100%;display:block}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eb{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
.navy .eb{color:var(--ebnavy)}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
h1{font-size:40px;font-weight:700}
h2{font-size:28px;font-weight:700}
h3{font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
p{margin:0 0 14px}
.lead{font-size:18px;color:var(--body)}
section{padding:56px 0}
.wash{background:var(--wash)}
.navy{background:var(--navy);color:#fff}
.navy .lead,.navy p{color:var(--onnavy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:2px;
  font:600 16px/1.2 var(--sans);border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--navy);border-color:var(--navy)}
.btn-o{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-o:hover{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}


/* header */
header{border-bottom:1px solid var(--rule)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:34px}
.pw{font:400 11px/1.2 var(--mono);color:var(--hint);letter-spacing:.06em;text-transform:uppercase;text-align:right}
.pw b{color:var(--blue);font-weight:500}

/* hero */
.hero{padding:44px 0 40px}
.hero h1{margin-bottom:18px}
.pillars{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.pillars li{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--light);color:var(--blue);padding:9px 12px;border-radius:2px}

/* heard */
.heard-list{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px}
.q{background:#fff;border-left:3px solid var(--blue);padding:16px 18px 14px;border-radius:2px}
.q blockquote{margin:0 0 8px;font-size:19px;line-height:1.35;font-weight:500;letter-spacing:-.01em}
.q .why{color:var(--body);font-size:15px;margin:0 0 8px}
.q cite{display:flex;align-items:center;gap:10px;font:400 12px/1.4 var(--mono);color:var(--hint);font-style:normal}
.q cite::before{content:"";width:24px;height:2px;background:var(--blue);flex:none}
.built{margin-top:26px;font-weight:600;font-size:19px}

/* preview */
.shots{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:20px;padding:6px 20px 18px;margin:24px -20px 0;-webkit-overflow-scrolling:touch}
.shot{flex:none;width:200px;scroll-snap-align:start;margin:0}
.shot img{width:100%;border:1px solid var(--rule2);border-radius:10px;box-shadow:0 8px 24px rgba(23,54,83,.12);background:#fff}
.shot figcaption{font:400 12px/1.4 var(--mono);color:var(--hint);margin-top:10px}
.desk{display:none}
.preview-cta{margin-top:18px;display:grid;gap:10px;justify-items:start}
.preview-cta .btn{justify-self:stretch}
.changed{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.changed li{display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--body)}
.changed li::before{content:"✓";color:var(--blue);font-weight:700;flex:none;margin-top:1px}

/* question */
.question{font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.015em;color:#fff;margin:0 0 14px}
.question em{font-style:normal;color:#fff;background:linear-gradient(transparent 62%,rgba(31,63,214,.85) 62%)}

/* reply */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0 0}
.tab{border:1px solid var(--rule2);background:#fff;border-radius:6px;padding:14px 6px 12px;font:600 15px/1.2 var(--sans);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent}
.tab .ic{font-size:22px;line-height:1}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px #fff inset}
.panel{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:22px 18px;margin-top:12px}
.panel[hidden]{display:none}
.hint{font:400 13px/1.5 var(--mono);color:var(--hint);margin:10px 0 0}
.rec{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.recbtn{width:112px;height:112px;border-radius:50%;border:0;background:var(--blue);color:#fff;font:600 15px/1.2 var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 8px var(--light);-webkit-tap-highlight-color:transparent}
.recbtn svg{width:30px;height:30px}
.recbtn.on{background:#C62828;box-shadow:0 0 0 8px #FBE3E3;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #FBE3E3}}
.timer{font:500 22px/1 var(--mono);color:var(--ink);min-height:22px}
audio{width:100%}
textarea{width:100%;min-height:170px;padding:14px;border:1px solid var(--rule2);border-radius:6px;font:400 17px/1.5 var(--sans);color:var(--ink);resize:vertical}
textarea:focus,.drop:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.drop{display:block;border:1.5px dashed var(--rule2);border-radius:6px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--wash)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop strong{display:block;font-size:17px;margin-bottom:4px}
.fname{font:400 13px/1.4 var(--mono);color:var(--ink);margin-top:10px;word-break:break-all}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
.err{color:#B3261E;font-size:15px;margin-top:12px}
.alt{margin-top:18px;font-size:15px;color:var(--body)}

/* thanks */
#thanks{display:none}
#thanks.show{display:block}
.echo{background:var(--light);border-radius:6px;padding:18px;margin:18px 0;font-size:17px;white-space:pre-wrap}
.echo .lbl{display:block;font:400 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:8px}

/* next */
.steps{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:18px}
.steps li::before{counter-increment:s;content:"0" counter(s);font:500 13px/1 var(--mono);color:#fff;background:var(--blue);border-radius:2px;padding:7px 8px;flex:none}
.steps h3{margin-bottom:4px}
.steps p{margin:0;color:var(--body);font-size:16px}
.glimpse{border-top:1px solid var(--rule2);margin-top:30px;padding-top:24px;color:var(--body)}

footer{border-top:1px solid var(--rule);padding:28px 0 40px;font-size:14px;color:var(--hint)}
footer p{margin:0 0 6px}
footer .verse{font-family:var(--mono);font-size:12px}
[hidden]{display:none!important}
.navy .question{color:#fff}
.navy .panel p{color:var(--body)}
.navy .panel .hint{color:var(--hint)}
.navy .panel .eb{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (min-width:860px){
  .wrap{padding:0 48px}
  h1{font-size:60px}
  h2{font-size:40px}
  section{padding:88px 0}
  .hero{padding:80px 0 72px}
  .hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:end}
  .lead{font-size:20px}
  .heard-list{grid-template-columns:1fr 1fr;gap:18px}
  .desk{display:block;margin-top:28px}
  .desk img{border:1px solid var(--rule2);border-radius:8px;box-shadow:0 18px 48px rgba(23,54,83,.14)}
  .shots{overflow:visible;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
  .shot{width:auto}
  .preview-cta{grid-template-columns:auto auto;justify-content:start;align-items:center}
  .changed{grid-template-columns:1fr 1fr}
  .question{font-size:38px}
  .q-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
  .tabs{margin-top:0}
  .steps{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}}
.pmode{background:var(--light);color:var(--blue);font:500 12px/1.4 var(--mono);text-align:center;padding:8px 12px;letter-spacing:.04em}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">WORLD MISSION INITIATIVE</div>
    <h1>Website Progress</h1>
    <div class="live-line">
      <span class="live-dot" id="liveDot" aria-hidden="true"></span>
      <span>Live build in progress · Updated <span id="updated"></span></span>
    </div>

    <div class="card">
      <div class="overall-row">
        <span class="overall-label">Overall</span>
        <span class="pct" id="pct">97.00000%</span>
      </div>
      <div class="bar-wrap" id="barWrap">
        <div class="bar-track">
          <div class="bar-fill" id="barFill" style="width:97%"></div>
        </div>
      </div>
      <div class="preview">Preview ready: <strong id="preview"></strong></div>
    </div>

    <div class="card">
      <div class="section-label">PAGES</div>
      <div id="pages"></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="section-label green">RECENTLY FINISHED</div>
        <div id="finished"></div>
      </div>
      <div class="card">
        <div class="section-label amber">WAITING ON</div>
        <div id="waiting"></div>
      </div>
    </div>
  </div>

  <!-- ZACH REVEAL: shown when STATUS.confirmed >= 100, or early with ?reveal=1 -->
  <template id="zachTpl">
<div class="pmode" id="pmode" hidden></div>
<header>
  <div class="wrap">
    <a class="brand" href="#top"><img src="zach/logo-icon.svg" alt="" width="34" height="34">WMI</a>
    <div class="pw">Prepared for Zach and Anna<br>with <b>SuperWho</b></div>
  </div>
</header>

<main id="top">

<!-- 1 · GREETING -->
<section class="hero">
  <div class="wrap">
    <div>
      <p class="eb">For Zachary Kyriazis · World Mission Initiative</p>
      <h1>Zach, we listened. Here's what we heard.</h1>
      <p class="lead">You told us you're <strong>“not just trying to proclaim, we're trying to reach.”</strong> So the new WMI site says who you are within “one inch of a scroll,” and it's built on the three things you actually do.</p>
    </div>
    <div>
      <p class="lead" style="margin-bottom:0">Take a look on your phone, then tell us what you think. Talking is fine. You don't need to write anything.</p>
      <ul class="pillars" aria-label="WMI's three pillars"><li>Reach</li><li>Equip</li><li>Multiply</li></ul>
    </div>
  </div>
</section>

<!-- 2 · WHAT WE HEARD -->
<section class="wash" id="heard">
  <div class="wrap">
    <p class="eb">In your own words</p>
    <h2>What you told us mattered most</h2>
    <ul class="heard-list">
      <li class="q">
        <blockquote>“Reach, equip, and multiply… reach, not just teach, but equip, not just give information, but actually equip them, and then multiply.”</blockquote>
        <p class="why">So the home page leads with all three pillars, not just the training.</p>
        <cite>Your voice memo 1 · Oct 27</cite>
      </li>
      <li class="q">
        <blockquote>“It's actually somebody that lives on mission.”</blockquote>
        <p class="why">That's how the site describes a missionary.</p>
        <cite>Your voice memo 1 · Oct 27</cite>
      </li>
      <li class="q">
        <blockquote>“I wanna be completely honest in everything that we're describing.”</blockquote>
        <p class="why">So we took the partner names off, say “12+ nations,” and promise to reply “as soon as possible.”</p>
        <cite>Your voice memo 1 · Oct 27</cite>
      </li>
      <li class="q">
        <blockquote>“This is not a little prayer group, but this is actually like a really big vision that we're going towards.”</blockquote>
        <p class="why">So Pray has its own page and its own way to sign up.</p>
        <cite>Your voice memo 2 · Oct 27</cite>
      </li>
    </ul>
    <p class="built">We built the site around that.</p>
  </div>
</section>

<!-- 3 · PREVIEW -->
<section id="preview">
  <div class="wrap">
    <p class="eb">Your new site</p>
    <h2>Have a look, the way a visitor would</h2>
    <p class="lead" style="margin-top:14px">It works best on your phone. Take your time. There's no wrong feedback.</p>

    <div class="shots" role="list" aria-label="Screens from the new site">
      <figure class="shot" role="listitem"><img src="zach/mobile-home.svg" alt="Home page on a phone: Carrying the Gospel to the nations, with the local church." loading="lazy"><figcaption>Home</figcaption></figure>
      <figure class="shot" role="listitem"><img src="zach/mobile-about.svg" alt="About page on a phone: Zachary and Anna's story." loading="lazy"><figcaption>About · your story</figcaption></figure>
      <figure class="shot" role="listitem"><img src="zach/mobile-global-work.svg" alt="Global Work page on a phone: People reached, equipped and sent." loading="lazy"><figcaption>Global Work</figcaption></figure>
      <figure class="shot" role="listitem"><img src="zach/mobile-give.svg" alt="Give page on a phone: Give to the mission." loading="lazy"><figcaption>Give</figcaption></figure>
    </div>
    <figure class="desk"><img src="zach/desktop-home-hero.svg" alt="Home page on a computer" loading="lazy"></figure>

    <div class="preview-cta">
      <a class="btn" id="previewBtn" href="https://www.worldmissioninitiative.com/" target="_blank" rel="noopener">Open the preview →</a>
    </div>

    <ul class="changed" aria-label="Changes made from your memos">
      <li>Reach · Equip · Multiply on the home page</li>
      <li>“12+ nations,” not a fixed number</li>
      <li>Partner names removed until agreements are signed</li>
      <li>No promised reply time: “as soon as possible”</li>
      <li>Clear paths to invite, give, pray and join the newsletter</li>
      <li>One photo style across the site on phones</li>
    </ul>
  </div>
</section>

<!-- 4 · ONE QUESTION + 5 · REPLY -->
<section class="navy" id="reply">
  <div class="wrap q-grid">
    <div>
      <p class="eb">One question</p>
      <p class="question" id="theQuestion">If a pastor in Ethiopia opened this site on his phone tomorrow, would he understand in one scroll that you <em>reach, equip and multiply</em>, and know exactly how to invite you?</p>
      <p class="lead">What's missing, or what feels off? Answer whichever way is easiest for you.</p>
    </div>

    <div>
      <div id="form">
        <div class="tabs" role="tablist" aria-label="How would you like to answer?">
          <button class="tab" role="tab" id="t-talk" aria-controls="p-talk" aria-selected="true"><span class="ic" aria-hidden="true">🎙</span>Talk</button>
          <button class="tab" role="tab" id="t-type" aria-controls="p-type" aria-selected="false"><span class="ic" aria-hidden="true">⌨️</span>Type</button>
          <button class="tab" role="tab" id="t-upload" aria-controls="p-upload" aria-selected="false"><span class="ic" aria-hidden="true">📎</span>Upload</button>
        </div>

        <!-- TALK -->
        <div class="panel" role="tabpanel" id="p-talk" aria-labelledby="t-talk" style="color:var(--ink)">
          <div class="rec">
            <button class="recbtn" id="recBtn" type="button" aria-live="polite">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
              <span id="recLabel">Tap to talk</span>
            </button>
            <div class="timer" id="timer" aria-live="off"></div>

    function wallClockPercent(now) {
      const anchorMs = Date.parse(STATUS.anchorTime);
      const elapsed = now - anchorMs;
      if (elapsed <= 0) return STATUS.anchorPercent;
      const raw = STATUS.anchorPercent + (100 - STATUS.anchorPercent) * (elapsed / REVEAL_AFTER_MS);
      return Math.min(raw, CEILING);

    const reached100 = wallClockPercent(Date.now()) >= 100;

    if (!REVEAL) {

    const finishedEl = document.getElementById("finished");

    updatedEl.textContent = STATUS.updated;
    previewEl.textContent = STATUS.preview;

    STATUS.pages.forEach((page) => {
      const color = COLORS[page.status] || COLORS.queued;

        '<span class="page-name">' +

        "</span>" +
        '<span class="page-status" style="color:' + color + '">' + LABEL[page.status] + "</span>";

    STATUS.finished.forEach((item) => {

    STATUS.waiting.forEach((item) => {
      const div = document.createElement("div");

    });

    const activeDot = document.querySelector(".dot.is-active");

    let pct = wallClockPercent(Date.now());
    let t = 0;

    function render() {
      const glow = 10 + 8 * Math.sin(t / 6);
      const pulse = 0.55 + 0.45 * Math.sin(t / 4);
      pctEl.textContent = pct.toFixed(5) + "%";
      barFill.style.width = pct + "%";
      barWrap.style.setProperty("--glow", glow + "px");
      liveDot.style.opacity = String(pulse);
      liveDot.style.boxShadow = "0 0 8px #22C55E";
      if (activeDot) {
        activeDot.style.boxShadow = "0 0 " + glow + "px currentColor";
        activeDot.style.opacity = String(0.6 + 0.4 * pulse);
      }
    }

    render();
    const tick = setInterval(() => {
      t += 1;
      pct = wallClockPercent(Date.now());
      if (pct >= 100) {
        clearInterval(tick);
        showZachPage();
        return;
      }
      render();
    }, 120);
    } else {
      showZachPage();
    }

    function showZachPage() {
      document.title = "For Zach — your new WMI site";
      document.querySelector('meta[name="theme-color"]').setAttribute("content", "#173653");
      document.querySelector('meta[name="color-scheme"]').setAttribute("content", "light");

      document.getElementById("progressCss").disabled = true;

      const tpl = document.getElementById("zachTpl");
      document.querySelector("body > .wrap").remove();
      document.body.insertBefore(tpl.content.cloneNode(true), tpl);

        const note = document.getElementById("pmode");

    function initZach() {
/* =====================================================================

   ===================================================================== */
// Apps Script web app that saves Zach's replies to Drive.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyplwI7aavAzhVGk8NKElsryoKRDW3yxA9Zz_cozIGanFuXNWYjqS190N_Km9R4J9UQ/exec";
// TODO(Jim): the "changes by" date, e.g. "Tuesday, Nov 24". Empty = that sentence is hidden.
const CHANGES_BY      = "";
const PREVIEW_URL     = "https://www.worldmissioninitiative.com/"; // live Wix site
const SHARED_KEY      = "wmi-zach";  // must match SHARED_KEY in Code.gs (a light spam guard, not real security)
const MAX_MB          = 30;          // bigger files: send Zach to the Drive folder instead
/* ===================================================================== */

const $ = id => document.getElementById(id);

/* tabs */

tabs.forEach(t => $('t-'+t).addEventListener('click', () => {

}));

function showErr(m){ const e=$('err'); e.textContent=m; e.hidden=false; e.style.color='#FFB4AB'; }
function hideErr(){ $('err').hidden=true; }

/* submit */
const blobToB64 = blob => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob);
});
async function submit(payload, echoHtml, btn){
  hideErr();
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Sending…';
  payload = Object.assign({
    key: SHARED_KEY, from: 'Zach', question: $('theQuestion').textContent.trim(),
    page: location.href, sentAt: new Date().toISOString(), userAgent: navigator.userAgent
  }, payload);
  let j = {};
  try {
    if (!DEMO) {
      // text/plain keeps this a "simple" request, so Apps Script doesn't need a CORS preflight
      const r = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
      j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status));
    } else {
      await new Promise(r => setTimeout(r, 600));
      $('demoNote').hidden = false;
    }
    $('echo').innerHTML = echoHtml;
    const rc = $('receipt'), parts = [];
    if (j && j.receivedAt) parts.push('Received at ' + j.receivedAt);
    if (j && j.receipt) parts.push('Receipt #' + j.receipt);
    rc.textContent = parts.join(' · '); rc.hidden = !parts.length;
    $('form').style.display = 'none';
    $('thanks').classList.add('show');
    $('thanks').focus();
  } catch (e) {
    showErr("That didn't go through (" + e.message + "). Please try again, or drop it in the Drive folder below.");
  } finally { btn.disabled = false; btn.textContent = label; }
}
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }; // no literal entities: the deploy tool decodes them
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

$('again').addEventListener('click', () => { $('thanks').classList.remove('show'); $('form').style.display=''; $('demoNote').hidden=true; });

});
$('sendFile').addEventListener('click', async () => {
  const f = $('file').files[0]; if (!f) return;

    '<span class="lbl">Received</span>' + esc(f.name) + ' (' + (f.size/1048576).toFixed(1) + ' MB)', $('sendFile'));
});

/* TALK: MediaRecorder */
let rec, chunks = [], stream, t0, tick, voiceBlob, voiceSecs = 0;
const pickType = () => ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus']
  .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
if (!canRecord) {
  $('recLabel').textContent = 'Not available';
  $('recBtn').disabled = true;
  $('recHint').textContent = "This browser can't record here. Use Type (with your keyboard's mic) or Upload a voice memo.";
}
async function startRec(){
  hideErr();
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch (e) { showErr('Microphone permission was blocked. You can allow it in your browser settings, or use Type or Upload.'); return; }
  const type = pickType();
  rec = new MediaRecorder(stream, type ? { mimeType:type } : undefined);
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    voiceBlob = new Blob(chunks, { type: rec.mimeType || type || 'audio/webm' });
    $('playback').src = URL.createObjectURL(voiceBlob); $('playback').hidden = false;
    $('recActions').hidden = false; $('recHint').textContent = 'Listen back if you like, then send.';
    $('recLabel').textContent = 'Tap to talk'; $('recBtn').classList.remove('on');
  };
  rec.start(1000);
  t0 = Date.now(); voiceSecs = 0; $('timer').textContent = '0:00';
  tick = setInterval(() => { voiceSecs = (Date.now()-t0)/1000; $('timer').textContent = fmt(voiceSecs); }, 250);
  $('recBtn').classList.add('on'); $('recLabel').textContent = 'Tap to stop';
  $('playback').hidden = true; $('recActions').hidden = true; $('recHint').textContent = "Listening… take your time.";
}
function stopRec(){ clearInterval(tick); if (rec && rec.state !== 'inactive') rec.stop(); }
$('recBtn').addEventListener('click', () => (rec && rec.state === 'recording') ? stopRec() : startRec());

$('sendVoice').addEventListener('click', async () => {
  if (!voiceBlob) return;
  if (voiceBlob.size > MAX_MB*1048576) { showErr('That recording is very long. Please save it as a memo and drop it in the Drive folder.'); return; }
  const ext = /mp4/.test(voiceBlob.type) ? 'm4a' : /ogg/.test(voiceBlob.type) ? 'ogg' : 'webm';
  const data = await blobToB64(voiceBlob);
  submit({ kind:'voice', filename:'zach-voice-note.' + ext, mimeType:voiceBlob.type, durationSec:Math.round(voiceSecs), data },

});
