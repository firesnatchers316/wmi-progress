<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1A2E">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Live website build progress for World Mission Initiative.">
  <title>WMI Website Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0B1A2E;
      --card: #122640;
      --blue: #3D6BFF;
      --cyan: #22D3EE;
      --green: #22C55E;
      --amber: #FBBF24;
      --ink: #F3F5F8;
      --muted: #9FB0C8;
      --track: #0A1424;
      --line: #1E3352;
      --queued: #3A4A63;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--navy);
      color: var(--ink);
      min-height: 100%;
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      padding: 28px 20px;
      padding-top: max(28px, env(safe-area-inset-top));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .kicker {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin: 6px 0 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .live-line {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--green);
      flex: 0 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 22px;
      margin-top: 22px;
    }

    .card + .card, .grid { margin-top: 16px; }

    .overall-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .overall-label {
      font-size: 14px;
      color: var(--muted);
    }

    .pct {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 34px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .bar-wrap {
      margin-top: 12px;
      filter: drop-shadow(0 0 var(--glow, 14px) rgba(34, 211, 238, 0.55));
    }

    .bar-track {
      height: 16px;
      background: var(--track);
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    .preview {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .preview strong {
      color: var(--amber);
      font-weight: 700;
    }

    .section-label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .section-label.green { color: var(--green); margin-bottom: 8px; }
    .section-label.amber { color: var(--amber); margin-bottom: 8px; }

    .page-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-row:last-child { border-bottom: none; }

    .page-name {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 7px;
      border: 2px solid currentColor;
      background: currentColor;
      flex: 0 0 auto;
    }

    .dot.queued {
      background: transparent;
    }

    .page-status {
      font-size: 13px;
      font-weight: 600;
    }

    .grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .grid .card {
      flex: 1 1 280px;
      margin-top: 0;
    }

    .item {
      font-size: 14px;
      padding: 4px 0;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">WORLD MISSION INITIATIVE</div>
    <h1>Website Progress</h1>
    <div class="live-line">
      <span class="live-dot" id="liveDot" aria-hidden="true"></span>
      <span>Live build in progress · Updated <span id="updated"></span></span>
    </div>

    <div class="card">
      <div class="overall-row">
        <span class="overall-label">Overall</span>
        <span class="pct" id="pct">42.00000%</span>
      </div>
      <div class="bar-wrap" id="barWrap">
        <div class="bar-track">
          <div class="bar-fill" id="barFill"></div>
        </div>
      </div>
      <div class="preview">Preview ready: <strong id="preview"></strong></div>
    </div>

    <div class="card">
      <div class="section-label">PAGES</div>
      <div id="pages"></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="section-label green">RECENTLY FINISHED</div>
        <div id="finished"></div>
      </div>
      <div class="card">
        <div class="section-label amber">WAITING ON</div>
        <div id="waiting"></div>
      </div>
    </div>
  </div>

  <script>
    // All editable values live here. Update this object, then redeploy.
    const STATUS = {
      updated: "Nov 18, 2026, 10:55 PM ET",
      confirmed: 80,
      nextMilestone: 84,
      preview: "Thursday, Nov 19, morning",
      pages: [
        { name: "Home", status: "done" },
        { name: "About", status: "done" },
        { name: "Invite WMI", status: "done" },
        { name: "Contact", status: "done" },
        { name: "Pray", status: "done" },
        { name: "Give", status: "done" },
        { name: "Mission & Vision", status: "active" },
        { name: "Global Work", status: "next" },
        { name: "Statement of Faith", status: "queued" },
        { name: "Get Involved", status: "queued" }
      ],
      finished: [
        "Design system matched to the approved V2 (fonts, colors)",
        "Site moved to its permanent home",
        "New Home page built into the main site",
        "Home page finished on desktop and phone",
        "About page finished on desktop and phone",
        "Invite page finished on desktop and phone",
        "Contact page finished on desktop and phone",
        "Pray page finished on desktop and phone",
        "Give page finished on desktop and phone (buttons get linked once giving details arrive)"
      ],
      waiting: [
        "Paid plan to switch on the forms (Gary)"
      ]
    };

    const COLORS = {
      done: "#22C55E",
      active: "#22D3EE",
      next: "#FBBF24",
      queued: "#3A4A63"
    };
    const LABEL = {
      done: "Done",
      active: "In progress",
      next: "Up next",
      queued: "Queued"
    };

    const updatedEl = document.getElementById("updated");
    const previewEl = document.getElementById("preview");
    const pctEl = document.getElementById("pct");
    const barFill = document.getElementById("barFill");
    const barWrap = document.getElementById("barWrap");
    const liveDot = document.getElementById("liveDot");
    const pagesEl = document.getElementById("pages");
    const finishedEl = document.getElementById("finished");
    const waitingEl = document.getElementById("waiting");

    updatedEl.textContent = STATUS.updated;
    previewEl.textContent = STATUS.preview;

    STATUS.pages.forEach((page) => {
      const color = COLORS[page.status] || COLORS.queued;
      const row = document.createElement("div");
      row.className = "page-row";
      row.innerHTML =
        '<span class="page-name">' +
          '<span class="dot' + (page.status === "queued" ? " queued" : "") +
            (page.status === "active" ? " is-active" : "") +
            '" style="color:' + color + '"></span>' +
          page.name +
        "</span>" +
        '<span class="page-status" style="color:' + color + '">' + LABEL[page.status] + "</span>";
      pagesEl.appendChild(row);
    });

    STATUS.finished.forEach((item) => {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = "✓ " + item;
      finishedEl.appendChild(div);
    });

    STATUS.waiting.forEach((item) => {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = "• " + item;
      waitingEl.appendChild(div);
    });

    const activeDot = document.querySelector(".dot.is-active");
    let pct = STATUS.confirmed;
    let t = 0;

    function render() {
      const glow = 10 + 8 * Math.sin(t / 6);
      const pulse = 0.55 + 0.45 * Math.sin(t / 4);
      pctEl.textContent = pct.toFixed(5) + "%";
      barFill.style.width = pct + "%";
      barWrap.style.setProperty("--glow", glow + "px");
      liveDot.style.opacity = String(pulse);
      liveDot.style.boxShadow = "0 0 8px #22C55E";
      if (activeDot) {
        activeDot.style.boxShadow = "0 0 " + glow + "px currentColor";
        activeDot.style.opacity = String(0.6 + 0.4 * pulse);
      }
    }

    render();
    setInterval(() => {
      t += 1;
      const gap = STATUS.nextMilestone - 0.5 - pct;
      if (gap > 0) pct += Math.max(gap * 0.0004, 0.00031);
      render();
    }, 120);
  </script>
</body>
</html>
