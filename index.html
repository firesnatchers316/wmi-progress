  <style id="progressCss">
    :root {
      --navy: #0B1A2E;
      --card: #122640;
      --blue: #3D6BFF;
      --cyan: #22D3EE;
      --green: #22C55E;
      --amber: #FBBF24;
      --ink: #F3F5F8;
      --muted: #9FB0C8;
      --track: #0A1424;
      --line: #1E3352;
      --queued: #3A4A63;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--navy);
      color: var(--ink);
      min-height: 100%;
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      padding: 28px 20px;
      padding-top: max(28px, env(safe-area-inset-top));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .kicker {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin: 6px 0 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .live-line {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--green);
      flex: 0 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 22px;
      margin-top: 22px;
    }

    .card + .card, .grid { margin-top: 16px; }

    .overall-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .overall-label {
      font-size: 14px;
      color: var(--muted);
    }

    .pct {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 34px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .bar-wrap {
      margin-top: 12px;
      filter: drop-shadow(0 0 var(--glow, 14px) rgba(34, 211, 238, 0.55));
    }

    .bar-track {
      height: 16px;
      background: var(--track);
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    .preview {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .preview strong {
      color: var(--amber);
      font-weight: 700;
    }

    .section-label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .section-label.green { color: var(--green); margin-bottom: 8px; }
    .section-label.amber { color: var(--amber); margin-bottom: 8px; }

    .page-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-row:last-child { border-bottom: none; }

    .page-name {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 7px;
      border: 2px solid currentColor;
      background: currentColor;
      flex: 0 0 auto;
    }

    .dot.queued {
      background: transparent;
    }

    .page-status {
      font-size: 13px;
      font-weight: 600;
    }

    .grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .grid .card {
      flex: 1 1 280px;
      margin-top: 0;
    }

    .item {
      font-size: 14px;
      padding: 4px 0;
      line-height: 1.45;
    }
  </style>
  <style id="zachCss" media="not all">
:root{
  --ink:#0B0E14; --blue:#1F3FD6; --navy:#173653; --light:#E6EBFC; --wash:#F3F5F8;
  --body:#3A4150; --hint:#5B6372; --rule:#E3E6EC; --rule2:#C9CFD9; --onnavy:#B9C3DD; --ebnavy:#B9CBE0;
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff;font-size:17px;line-height:1.55}
img{max-width:100%;display:block}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eb{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
.navy .eb{color:var(--ebnavy)}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
h1{font-size:40px;font-weight:700}
h2{font-size:28px;font-weight:700}
h3{font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
p{margin:0 0 14px}
.lead{font-size:18px;color:var(--body)}
section{padding:56px 0}
.wash{background:var(--wash)}
.navy{background:var(--navy);color:#fff}
.navy .lead,.navy p{color:var(--onnavy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:2px;
  font:600 16px/1.2 var(--sans);border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--navy);border-color:var(--navy)}
.btn-o{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-o:hover{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}


/* header */
header{border-bottom:1px solid var(--rule)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:34px}
.pw{font:400 11px/1.2 var(--mono);color:var(--hint);letter-spacing:.06em;text-transform:uppercase;text-align:right}
.pw b{color:var(--blue);font-weight:500}

/* hero */
.hero{padding:44px 0 40px}
.hero h1{margin-bottom:18px}
.pillars{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.pillars li{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--light);color:var(--blue);padding:9px 12px;border-radius:2px}

/* heard */
.heard-list{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px}
.q{background:#fff;border-left:3px solid var(--blue);padding:16px 18px 14px;border-radius:2px}
.q blockquote{margin:0 0 8px;font-size:19px;line-height:1.35;font-weight:500;letter-spacing:-.01em}
.q .why{color:var(--body);font-size:15px;margin:0 0 8px}
.q cite{display:flex;align-items:center;gap:10px;font:400 12px/1.4 var(--mono);color:var(--hint);font-style:normal}
.q cite::before{content:"";width:24px;height:2px;background:var(--blue);flex:none}
.built{margin-top:26px;font-weight:600;font-size:19px}

/* preview */
.shots{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:20px;padding:6px 20px 18px;margin:24px -20px 0;-webkit-overflow-scrolling:touch}
.shot{flex:none;width:200px;scroll-snap-align:start;margin:0}
.shot img{width:100%;border:1px solid var(--rule2);border-radius:10px;box-shadow:0 8px 24px rgba(23,54,83,.12);background:#fff}
.shot figcaption{font:400 12px/1.4 var(--mono);color:var(--hint);margin-top:10px}
.desk{display:none}
.preview-cta{margin-top:18px;display:grid;gap:10px;justify-items:start}
.preview-cta .btn{justify-self:stretch}
.changed{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.changed li{display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--body)}
.changed li::before{content:"✓";color:var(--blue);font-weight:700;flex:none;margin-top:1px}

/* question */
.question{font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-.015em;color:#fff;margin:0 0 14px}
.question em{font-style:normal;color:#fff;background:linear-gradient(transparent 62%,rgba(31,63,214,.85) 62%)}

/* reply */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0 0}
.tab{border:1px solid var(--rule2);background:#fff;border-radius:6px;padding:14px 6px 12px;font:600 15px/1.2 var(--sans);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent}
.tab .ic{font-size:22px;line-height:1}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px #fff inset}
.panel{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:22px 18px;margin-top:12px}
.panel[hidden]{display:none}
.hint{font:400 13px/1.5 var(--mono);color:var(--hint);margin:10px 0 0}
.rec{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.recbtn{width:112px;height:112px;border-radius:50%;border:0;background:var(--blue);color:#fff;font:600 15px/1.2 var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 8px var(--light);-webkit-tap-highlight-color:transparent}
.recbtn svg{width:30px;height:30px}
.recbtn.on{background:#C62828;box-shadow:0 0 0 8px #FBE3E3;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #FBE3E3}}
.timer{font:500 22px/1 var(--mono);color:var(--ink);min-height:22px}
audio{width:100%}
textarea{width:100%;min-height:170px;padding:14px;border:1px solid var(--rule2);border-radius:6px;font:400 17px/1.5 var(--sans);color:var(--ink);resize:vertical}
textarea:focus,.drop:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.drop{display:block;border:1.5px dashed var(--rule2);border-radius:6px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--wash)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop strong{display:block;font-size:17px;margin-bottom:4px}
.fname{font:400 13px/1.4 var(--mono);color:var(--ink);margin-top:10px;word-break:break-all}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
.err{color:#B3261E;font-size:15px;margin-top:12px}
.alt{margin-top:18px;font-size:15px;color:var(--body)}

/* thanks */
#thanks{display:none}
#thanks.show{display:block}
.echo{background:var(--light);border-radius:6px;padding:18px;margin:18px 0;font-size:17px;white-space:pre-wrap}
.echo .lbl{display:block;font:400 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:8px}

/* next */
.steps{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:18px}
.steps li::before{counter-increment:s;content:"0" counter(s);font:500 13px/1 var(--mono);color:#fff;background:var(--blue);border-radius:2px;padding:7px 8px;flex:none}
.steps h3{margin-bottom:4px}
.steps p{margin:0;color:var(--body);font-size:16px}
.glimpse{border-top:1px solid var(--rule2);margin-top:30px;padding-top:24px;color:var(--body)}

footer{border-top:1px solid var(--rule);padding:28px 0 40px;font-size:14px;color:var(--hint)}
footer p{margin:0 0 6px}
footer .verse{font-family:var(--mono);font-size:12px}
[hidden]{display:none!important}
.navy .question{color:#fff}
.navy .panel p{color:var(--body)}
.navy .panel .hint{color:var(--hint)}
.navy .panel .eb{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (min-width:860px){
  .wrap{padding:0 48px}
  h1{font-size:60px}
  h2{font-size:40px}
  section{padding:88px 0}
  .hero{padding:80px 0 72px}
  .hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:end}
  .lead{font-size:20px}
  .heard-list{grid-template-columns:1fr 1fr;gap:18px}
  .desk{display:block;margin-top:28px}
  .desk img{border:1px solid var(--rule2);border-radius:8px;box-shadow:0 18px 48px rgba(23,54,83,.14)}
  .shots{overflow:visible;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
  .shot{width:auto}
  .preview-cta{grid-template-columns:auto auto;justify-content:start;align-items:center}
  .changed{grid-template-columns:1fr 1fr}
  .question{font-size:38px}
  .q-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
  .tabs{margin-top:0}
  .steps{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}}
/* heard 10 (Nov 20) */
.newstrip{background:var(--light);color:var(--navy);font-size:15px;line-height:1.45;padding:12px 0;border-bottom:1px solid var(--rule)}
.newstrip .wrap{display:flex;gap:10px;align-items:flex-start}
.newstrip a{color:var(--blue);font-weight:600;white-space:nowrap}
.newstrip-msg{flex:1;min-width:0;white-space:pre-wrap}
.newtag{flex:none;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--blue);color:#fff;padding:5px 7px;border-radius:2px;margin-top:2px}
#update{border-top:1px solid var(--rule)}
.hupd{margin:0 0 4px}
.heard10{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px;counter-reset:h}
.heard10 li{display:grid;grid-template-columns:32px 1fr;column-gap:12px;row-gap:8px;align-items:start;align-content:start;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:14px 14px 14px 12px}
.heard10 li.is-done{background:#FAFCFA}
.heard10 li::before{counter-increment:h;content:counter(h);grid-row:span 2;font:600 13px/1 var(--mono);color:var(--blue);background:var(--light);border-radius:2px;width:32px;height:28px;display:flex;align-items:center;justify-content:center}
.heard10 li.extra::before{content:"+"}
.heard10 .ht{font-size:16px;line-height:1.45;color:var(--ink)}
.pill{justify-self:start;font:600 12px/1 var(--mono);letter-spacing:.04em;padding:6px 9px;border-radius:99px;white-space:nowrap}
.pill.done{background:#E3F4E8;color:#1B6E35}
.pill.prog{background:var(--light);color:var(--blue)}
.pill.gary{background:#FFF1D6;color:#7A4E00}
.pill.you{background:#F6E3F7;color:#7A1F80}
.pill.jim{background:#E6ECF3;color:var(--navy)}
.hb{margin-top:28px;background:var(--wash);border:1px solid var(--rule);border-radius:6px;padding:20px 16px}
.hb h3{margin-bottom:6px}
.hb .lead{font-size:16px;margin-bottom:12px}
.hb-extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hb-extras .btn{min-height:48px;padding:0 10px;font-size:15px;background:#fff}
.hb-extras .btn:hover{background:var(--ink);color:#fff}
.hb-extras .btn.on{background:#C62828;border-color:#C62828;color:#fff}
.hb-file{position:relative}
.hb-file input{position:absolute;opacity:0;width:1px;height:1px}
.hb-voice{margin-top:12px;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:12px;display:grid;gap:8px}
.hb-voice .row{margin-top:0}
.hb-files{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.hb-files li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font:400 13px/1.4 var(--mono);word-break:break-all}
.hb-files button{flex:none;border:0;background:none;color:var(--blue);font:600 14px/1 var(--sans);cursor:pointer;padding:6px}
.hb .btn.full{margin-top:16px}
.hb-thanks{margin-top:28px}
@media (min-width:860px){.hb h2{font-size:34px}.hb-modes{max-width:520px}}
@media (min-width:860px){
  .heard10{grid-template-columns:1fr 1fr;gap:12px}
  .hb{padding:28px}
  .hb-box{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
}
/* live status bars (Nov 20) */
.hst{display:grid;gap:7px}
.hst-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hst-pct{font:600 13px/1 var(--mono);color:var(--blue)}
.hst-when{font:400 12px/1.4 var(--mono);color:var(--hint)}
.hst-now{font-size:14px;line-height:1.4;color:var(--body);margin:0}
.hst-now b{font-weight:600;color:var(--ink)}
.hbar{height:10px;border-radius:99px;background:#EDF0F5;overflow:hidden;position:relative}
.hbar i{display:block;height:100%;width:0;border-radius:inherit;background-color:var(--blue);transition:width .9s ease}
.hbar.run i{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 7px,transparent 7px 14px);background-size:19.8px 19.8px;animation:hstripe 1.4s linear infinite}
@keyframes hstripe{to{background-position:19.8px 0}}
.hbar.wait i{background:#E7C97A}
.hst.waiting .hst-now{color:#6B5520}
.hst.done .hst-when{color:#1B6E35}
.hov{margin-top:20px;background:var(--navy);color:#fff;border-radius:8px;padding:16px 16px 14px}
.hov-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hov-n{font-size:22px;font-weight:700;letter-spacing:-.01em}
.hov-p{font:600 15px/1 var(--mono);color:#B9CBE0}
.hov .hbar{height:12px;margin-top:12px;background:rgba(255,255,255,.14)}
.hov .hbar i{background-color:#5B8CFF}
.hov .hst-when{color:#B9CBE0;margin-top:10px;display:block}
@media (prefers-reduced-motion:reduce){.hbar.run i{animation:none}.hbar i{transition:none}}

/* talk to us card (Nov 20) */
.hb{border:2px solid var(--blue);background:#fff;animation:hglow 3.6s ease-in-out infinite}
@keyframes hglow{0%,100%{box-shadow:0 0 0 0 rgba(31,63,214,.10),0 6px 18px rgba(31,63,214,.08)}50%{box-shadow:0 0 0 7px rgba(31,63,214,.16),0 10px 34px rgba(31,63,214,.22)}}
.hb h2{font-size:28px;margin-bottom:8px}
.hb-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
.hb-mode{position:relative;min-height:76px;border:1.5px solid var(--blue);border-radius:8px;background:var(--light);color:var(--blue);font:600 16px/1.2 var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:8px 4px}
.hb-mode .ic{font-size:24px;line-height:1}
.hb-mode:hover{background:#D6DEFA}
.hb-mode.on{background:#C62828;border-color:#C62828;color:#fff}
.hb-mode[disabled]{opacity:.45;cursor:not-allowed}

    hChunks = [];
    hRec.ondataavailable = e => { if (e.data && e.data.size) hChunks.push(e.data); };
    hRec.onstop = () => {
      hStream.getTracks().forEach(t => t.stop());
      hBlob = new Blob(hChunks, { type: hRec.mimeType || type || 'audio/webm' });
      $('hbPlay').src = URL.createObjectURL(hBlob); $('hbPlay').hidden = false;
      $('hbVoiceActions').hidden = false;
      $('hbTimer').textContent = 'Voice note ' + fmt(hSecs) + ' · ready to send';
      $('hbRecLabel').textContent = 'Record again'; $('hbRec').classList.remove('on');
    };
    hRec.start(1000);
    hT0 = Date.now(); hSecs = 0; hBlob = null;
    $('hbVoice').hidden = false; $('hbPlay').hidden = true; $('hbVoiceActions').hidden = true;
    $('hbTimer').textContent = 'Recording 0:00';
    hTick = setInterval(() => { hSecs = (Date.now()-hT0)/1000; $('hbTimer').textContent = 'Recording ' + fmt(hSecs); }, 250);
    $('hbRec').classList.add('on'); $('hbRecLabel').textContent = 'Tap to stop';
  }
  function hStop(){ clearInterval(hTick); if (hRec && hRec.state !== 'inactive') hRec.stop(); }
  $('hbRec').addEventListener('click', () => (hRec && hRec.state === 'recording') ? hStop() : hStart());
  $('hbVoiceDel').addEventListener('click', () => {
    hBlob = null; $('hbPlay').hidden = true; $('hbVoiceActions').hidden = true; $('hbVoice').hidden = true;
    $('hbRecLabel').textContent = 'Voice';
  });

  async function sendOne(payload){
    payload = Object.assign({
      key: SHARED_KEY, from: 'Zach', question: HEARD_QUESTION,
      page: location.href + '#update', sentAt: new Date().toISOString(), userAgent: navigator.userAgent
    }, payload);
    if (DEMO) { await new Promise(r => setTimeout(r, 400)); return { ok:true, demo:true }; }
    const r = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  $('hbSend').addEventListener('click', async () => {
    clrErr();
    if (hRec && hRec.state === 'recording') { err('Tap "Tap to stop" to finish your voice note first.'); return; }
    const text = $('hbText').value.trim();
    if (!text && !hBlob && !files.length) { err('Type something, record a voice note, or add a photo first.'); return; }
    const btn = $('hbSend'); btn.disabled = true; const label = btn.textContent;
    const jobs = [];
    if (text) jobs.push({ name:'Your note', make: async () => ({ kind:'text', text }) });
    if (hBlob) { const b = hBlob, secs = hSecs; jobs.push({ name:'Your voice note (' + fmt(secs) + ')', make: async () => {
      const ext = /mp4/.test(b.type) ? 'm4a' : /ogg/.test(b.type) ? 'ogg' : 'webm';
      return { kind:'voice', filename:'zach-heard-reply.' + ext, mimeType:b.type, durationSec:Math.round(secs), text: text ? 'With note: ' + text : '', data: await blobToB64(b) };
    } }); }
    files.slice().forEach(f => jobs.push({ name: f.name, make: async () => ({ kind:'upload', filename:f.name, mimeType:f.type || 'application/octet-stream', text: text ? 'With note: ' + text : '', data: await blobToB64(f) }) }));
    const done = [], receipts = []; let at = '', demo = false;
    try {
      for (let i = 0; i < jobs.length; i++) {
        btn.textContent = jobs.length > 1 ? 'Sending ' + (i+1) + ' of ' + jobs.length + '…' : 'Sending…';
        const j = await sendOne(await jobs[i].make());
        done.push(jobs[i].name); if (j.receipt) receipts.push('#' + j.receipt); if (j.receivedAt) at = j.receivedAt; if (j.demo) demo = true;
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = label;
      err("That didn't go through (" + e.message + ")." + (done.length ? ' Already sent: ' + done.join(', ') + '.' : '') + ' Please try again, or drop it in your WMI Drive folder.');
      return;
    }
    const echo = $('hbEcho'); echo.textContent = '';
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = text ? "Here's what we got" : 'Received';
    echo.appendChild(lbl);
    echo.appendChild(document.createTextNode(text || done.join('\n')));
    if (text && done.length > 1) echo.appendChild(document.createTextNode('\n\nPlus: ' + done.slice(1).join(', ')));
    const parts = [];
    if (at) parts.push('Received at ' + at);
    if (receipts.length) parts.push('Receipt ' + receipts.join(', '));
    $('hbReceipt').textContent = parts.join(' · '); $('hbReceipt').hidden = !parts.length;
    $('hbDemo').hidden = !demo;
    $('hbText').value = ''; files = []; renderFiles(); hBlob = null;
    $('hbVoice').hidden = true; $('hbRecLabel').textContent = 'Voice';
    btn.disabled = false; btn.textContent = label;
    $('hbForm').hidden = true; $('hbThanks').hidden = false; $('hbThanks').focus();
  });
  $('hbAgain').addEventListener('click', () => { $('hbThanks').hidden = true; $('hbForm').hidden = false; clrErr(); });
})();

/* page-open ping: one POST per visit (sessionStorage), no personal data, no cookies.
   Sends only key, kind and the page path. Skipped for ?test, ?notrack, ?preview and automated browsers. */
(function openPing(){
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('test') || q.has('notrack') || q.has('preview')) return;
    if (navigator.webdriver || /HeadlessChrome/.test(navigator.userAgent)) return;
    if (DEMO) return;
    if (sessionStorage.getItem('wmiZachOpen')) return;
    sessionStorage.setItem('wmiZachOpen', '1');
    fetch(APPS_SCRIPT_URL, { method:'POST', mode:'no-cors', keepalive:true, credentials:'omit',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: SHARED_KEY, kind: 'open', page: location.pathname + location.hash }) }).catch(() => {});
  } catch (e) {}
})();
